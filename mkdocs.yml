# Site name
site_name: Virtual Machines
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - Allocations: index.md
  - GoToMyPC Instructions: gotomypc-instructions.md
  - Learn on Demand: lod-instructions.md

not_in_nav: |
  404.md
  PC01.md
  PC02.md
  PC03.md
  PC04.md
  PC05.md
  PC06.md
  PC07.md
  PC08.md
  PC09.md
  PC10.md
  PC11.md
  PC12.md
  PC13.md
  PC14.md
  PC15.md
  PC16.md
  PC17.md
  PC18.md

# Theme
theme:
    palette:
      primary: green
    features:
      - toc.integrate
      - content.code.copy
    name: material
    icon:
      logo: material/laptop
    static_templates:
      - 404.html

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

plugins:
  - search
  - glightbox
  - open-in-new-tab

